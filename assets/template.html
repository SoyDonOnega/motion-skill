<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPIC NAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* motion engine: one fixed-size stage, each frame is a pure function of t. */
/* STYLE TOKENS: the only block a custom style changes. Default: black and white, one light theme. */
:root {
  --bg: #FAFAF8; --ink: #0A0A0A; --mute: #666666; --line: #CCCCCC; --paper: #FFFFFF;
  --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font-family: var(--sans); padding: 24px 16px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
.frame { position: relative; width: 100%; max-width: 100%; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); overflow: hidden; font-feature-settings: "tnum" 1; }
.bar { display: flex; align-items: center; gap: 14px; font: 500 12px/1 var(--mono); color: var(--mute); }
.bar button { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); padding: 9px 14px; cursor: pointer; min-width: 84px; }
.bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bar input[type=range] { flex: 1; min-width: 0; accent-color: var(--ink); }
.hint { font: 400 12px/1.5 var(--mono); color: var(--mute); }
body.render { padding: 0; }
body.render .wrap { max-width: none; display: block; }
body.render .frame { border: 0; }
body.render .bar, body.render .hint { display: none; }

/* Grid: --mx is the side margin (140px at 16:9, 90px at 9:16 and 1:1). */
#stage { --mx: 140px; }
#stage[data-format="9:16"], #stage[data-format="1:1"] { --mx: 90px; }
.eyebrow { position: absolute; left: var(--mx); top: 96px; font: 600 20px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; }
.eyebrow span { color: var(--mute); }
.src { position: absolute; left: var(--mx); bottom: 84px; font: 400 19px/1.4 var(--mono); color: var(--mute); }
.tag { position: absolute; right: var(--mx); bottom: 84px; font: 500 17px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); border: 1px solid var(--line); padding: 10px 14px; }
.rule { position: absolute; left: var(--mx); right: var(--mx); bottom: 140px; height: 1px; background: var(--line); }
#prog { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ink); width: 0; }
.scene { position: absolute; inset: 0; opacity: 0; }
.m { overflow: hidden; display: block; }
/* padding in the child's own em keeps descenders inside the mask at any size */
.m > * { display: block; will-change: transform; padding-bottom: .2em; }
.h1 { font: 600 64px/1.12 var(--sans); letter-spacing: -.02em; }
.h2 { font: 400 34px/1.35 var(--sans); color: var(--mute); }
.lab { font: 600 18px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.big { font: 600 150px/1 var(--sans); letter-spacing: -.04em; }
.abs { position: absolute; }
.box { border: 2px solid var(--ink); background: var(--paper); }
.inv { background: var(--ink); color: var(--paper); }
.mono { font-family: var(--mono); }
.close { font: 600 34px/1.3 var(--sans); border-top: 2px solid var(--ink); padding-top: 20px; }
/* Styles specific to this topic's scenes, below. */
</style>
</head>
<body>
<div class="wrap">
  <div class="frame" id="frame">
    <!-- data-format: 16:9 (1920x1080), 9:16 (1080x1920) or 1:1 (1080x1080). Scene coordinates are in stage pixels. -->
    <div id="stage" data-format="16:9">

      <!-- S0 hook. The first scene has no entry seam. -->
      <section class="scene" data-s="0,6">
        <div class="eyebrow">TOPIC <span>· FIELD</span></div>
        <div class="abs" style="left:126px; top:230px;">
          <div class="m" data-t="0.2"><div style="font:600 380px/0.9 var(--sans); letter-spacing:-.06em;">HOOK</div></div>
        </div>
        <div class="abs" style="left:140px; top:620px; width:1400px;">
          <div class="m" data-t="1.0"><div class="lab">Full name · second label</div></div>
          <div class="m" data-t="1.6" style="margin-top:26px;"><div class="h1">One-sentence promise or question.</div></div>
        </div>
        <div class="rule"></div>
        <div class="src">Source, pinpoint</div>
      </section>

      <!-- S1 sample scene. data-seam: left (default, next beat), up (a conclusion rises), zoom (deeper into the same thought).
           data-vo: optional narration clip for this scene, played from the scene start. -->
      <section class="scene" data-s="6,14" data-seam="left">
        <div class="eyebrow">Step 1 <span>· What happens</span></div>
        <div class="abs" style="left:140px; top:190px; width:1640px;">
          <div class="m" data-t="6.3"><div class="h1">A headline with one idea.</div></div>
        </div>
        <div class="abs box" style="left:140px; top:420px; width:640px; height:120px; display:grid; place-content:center;"
             data-a='[["opacity",7.0,7.5,0,1],["y",7.0,7.7,30,0]]'>
          <b style="font:600 40px/1 var(--sans);">Element</b>
        </div>
        <div class="abs" style="left:140px; top:760px; width:1640px;">
          <div class="m" data-t="10.2"><div class="close">Closing sentence of the scene.</div></div>
        </div>
        <div class="rule"></div>
        <div class="src">Source, pinpoint</div>
        <div class="tag">Example data</div>
      </section>

      <div id="prog"></div>
    </div>
  </div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="14" step="0.01" value="0" aria-label="Timeline">
    <span id="clock">0.0 / 14.0 s</span>
  </div>
  <div class="hint">Space: play or pause · ← → step one frame · R: restart.</div>
</div>

<script>
(() => {
  // Total duration: equal to the end of the last scene and to the slider max.
  const T = 14;
  // Player button labels, in the output language.
  const L = { play: 'Play', pause: 'Pause' };
  // If needed, generate repeated elements (blocks, steps) here, before they are collected below.

  // ---- Engine: do not edit below this line. ----
  const FORMATS = { '16:9': [1920, 1080], '9:16': [1080, 1920], '1:1': [1080, 1080] };
  const stage = document.getElementById('stage'), frame = document.getElementById('frame');
  const [W, H] = FORMATS[stage.dataset.format] || FORMATS['16:9'];
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  frame.style.aspectRatio = `${W} / ${H}`;
  const render = /[?&]render/.test(location.search);
  if (render) { document.body.classList.add('render'); frame.style.width = W + 'px'; frame.style.height = H + 'px'; }

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const out = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x) * (1 - x * 0.001);
  const io = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const in4 = x => x * x * x * x, out4 = x => 1 - Math.pow(1 - x, 4);

  // Seam law: a scene exits along the vector the next scene enters with (same axis, same direction),
  // exit accelerates (in4) and entry decelerates (out4), so the cut lands mid-motion on both sides.
  const SEAM = 0.5, LEAD = 0.15, DIST = 220;
  const VEC = {
    left: p => ({ x: -p * DIST, y: 0, s: 1 }),
    up: p => ({ x: 0, y: -p * DIST, s: 1 }),
    zoom: p => ({ x: 0, y: 0, s: 1 + p * 0.12 }),
  };
  const scenes = [...document.querySelectorAll('.scene')].map(el => ({
    el, s: el.dataset.s.split(',').map(Number), seam: VEC[el.dataset.seam] ? el.dataset.seam : 'left',
    vo: el.dataset.vo ? Object.assign(new Audio(el.dataset.vo), { preload: 'auto' }) : null,
  }));
  scenes.forEach((sc, i) => { sc.exit = scenes[i + 1] ? scenes[i + 1].seam : null; sc.first = i === 0; });
  const rises = [...document.querySelectorAll('.m[data-t]')].map(el => ({ inner: el.firstElementChild, t: +el.dataset.t }));
  const anims = [...document.querySelectorAll('[data-a]')].map(el => ({ el, k: JSON.parse(el.dataset.a) }));
  const prog = document.getElementById('prog');

  window.seek = t => {
    for (const sc of scenes) {
      const [s0, s1] = sc.s;
      let o = 1, x = 0, y = 0, s = 1;
      if (!sc.first) {
        const q = out4(seg(t, s0 - LEAD, s0 - LEAD + SEAM)), v = VEC[sc.seam](-(1 - q));
        o *= q; x += v.x; y += v.y; s *= sc.seam === 'zoom' ? 1 - (1 - q) * 0.12 : 1;
      }
      if (sc.exit) {
        const p = in4(seg(t, s1 - SEAM, s1)), v = VEC[sc.exit](p);
        o *= 1 - p; x += v.x; y += v.y; s *= v.s;
      }
      if (t < s0 - LEAD || (sc.exit && t > s1)) o = 0;
      sc.el.style.opacity = o;
      sc.el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
      sc.el.style.visibility = o > 0 ? 'inherit' : 'hidden';
    }
    for (const { inner, t: t0 } of rises) {
      const p = out(seg(t, t0, t0 + .7));
      inner.style.transform = `translateY(${(1 - p) * 108}%)`;
    }
    for (const { el, k } of anims) {
      let x = 0, y = 0;
      const seen = new Set();
      for (const [prop, t0, t1, v0, v1, unit = ''] of k) {
        // later rows for the same property take over only once they start
        if (seen.has(prop) && t < t0) continue;
        seen.add(prop);
        const v = v0 + (v1 - v0) * io(seg(t, t0, t1));
        if (prop === 'x') x = v; else if (prop === 'y') y = v;
        else el.style[prop] = v + unit;
      }
      if (k.some(r => r[0] === 'x' || r[0] === 'y')) el.style.transform = `translate(${x}px, ${y}px)`;
    }
    prog.style.width = (t / T * 100) + '%';
  };
  window.motion = { T, W, H, seam: SEAM, lead: LEAD, scenes: scenes.map(sc => ({ s: sc.s, seam: sc.seam, vo: sc.el.dataset.vo || null })) };

  const fit = () => { if (!render) stage.style.transform = `scale(${frame.clientWidth / W})`; };
  addEventListener('resize', fit); fit();

  // Narration: each scene's clip plays from its scene start while the timeline plays.
  const sync = (t, playing) => {
    for (const { vo, s } of scenes) {
      if (!vo) continue;
      // a clip ends on its own; it is only stopped when playback stops or leaves its scene
      const local = t - s[0], inside = playing && local >= 0 && local < s[1] - s[0];
      if (inside && vo.paused && local < (vo.duration || Infinity) - 0.05) { vo.currentTime = local; vo.play().catch(() => {}); }
      else if (!inside && !vo.paused) vo.pause();
    }
  };
  // After a jump in t (restart, scrub), stop every clip so sync restarts them at the right offset.
  const jump = () => scenes.forEach(({ vo }) => vo && !vo.paused && vo.pause());

  let t = 0, playing = !render && !matchMedia('(prefers-reduced-motion: reduce)').matches, last = null;
  const btn = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  const show = () => { seek(t); sync(t, playing); scrub.value = t; clock.textContent = `${t.toFixed(1)} / ${T.toFixed(1)} s`; btn.textContent = playing ? L.pause : L.play; };
  const tick = now => {
    if (playing) { if (last !== null) t += (now - last) / 1000; if (t >= T) { t = T; playing = false; } show(); }
    last = now; requestAnimationFrame(tick);
  };
  const toggle = () => { if (t >= T) { t = 0; jump(); } playing = !playing; show(); };
  btn.addEventListener('click', toggle);
  scrub.addEventListener('input', () => { t = +scrub.value; playing = false; jump(); show(); });
  addEventListener('keydown', e => {
    if (render) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { playing = false; t = Math.min(T, t + 1 / 60); show(); }
    else if (e.key === 'ArrowLeft') { playing = false; t = Math.max(0, t - 1 / 60); show(); }
    else if (e.key === 'r' || e.key === 'R') { t = 0; playing = true; jump(); show(); }
  });
  // With reduced motion, show a representative frame of the hook.
  if (!playing && !render) t = Math.min(4.5, T);
  show();
  document.fonts.ready.then(() => { window.ready = true; if (!render) requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
